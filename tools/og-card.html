<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og-card source (not shipped)</title>
<!--
  Source for site/assets/og-card.png (1200x630, the 1.91:1 ratio social platforms expect).
  Render with tools/render-og-card.sh — it drives headless Chrome, no dependencies.
  Lives outside site/ on purpose, so it never gets published.
  Styling mirrors normal mode in site/styles.css: cream ground, dot texture, flat
  borders, accent #1547e6, monospace as structure, hazard strip echoing the marquee.
-->
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  body{
    background-color:#f6f5f0;
    background-image:
      radial-gradient(rgba(21,71,230,0.16) 2px, transparent 2px),
      radial-gradient(rgba(168,113,10,0.14) 2px, transparent 2px);
    background-size:44px 44px, 44px 44px;
    background-position:0 0, 22px 22px;
    color:#14161a;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  .mono{ font-family:"SF Mono", Menlo, monospace; font-weight:700; }

  .hazard{
    height:26px;
    background:repeating-linear-gradient(45deg, #ffe600, #ffe600 14px, #000 14px, #000 28px);
    border-bottom:4px solid #14161a;
  }
  .card{
    height:604px;
    display:flex;
    align-items:center;
    gap:56px;
    padding:56px 64px;
  }
  .shot{
    flex:0 0 300px;
    width:300px; height:300px;
    border:6px solid #1547e6;
    object-fit:cover;
    display:block;
  }
  .name{
    font-size:82px;
    line-height:1.03;
    letter-spacing:-0.02em;
    font-weight:700;
  }
  .role{
    margin-top:18px;
    display:inline-block;
    background:#1547e6;
    color:#fff;
    font-size:30px;
    font-weight:700;
    padding:8px 16px;
    letter-spacing:0.01em;
  }
  .stack{
    margin-top:22px;
    font-size:27px;
    line-height:1.45;
    color:#2b2f36;
  }
  .facts{
    margin-top:14px;
    font-size:22px;
    color:#494c53;
  }
  .cta{
    margin-top:30px;
    display:inline-block;
    border:4px solid #14161a;
    background:#fff;
    font-size:28px;
    padding:10px 18px;
    color:#1547e6;
  }
</style>
</head>
<body>
  <div class="hazard"></div>
  <div class="card">
    <img class="shot" src="../site/assets/headshot.jpg" alt="">
    <div>
      <div class="name">József Márton<br>Jung</div>
      <div class="role">Senior Backend Engineer</div>
      <div class="stack">Go · Python · Java · distributed systems</div>
      <div class="facts mono">16 years · GoLab 2025 speaker · Novi Sad, Serbia</div>
      <div class="cta mono">→ jozef.rocks</div>
    </div>
  </div>
</body>
</html>
